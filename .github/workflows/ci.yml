name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install notification image renderer
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Run quickshell test suite
        run: node --test linux/config/quickshell/tests/*.test.cjs

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck zsh
      - name: Lint shell scripts
        run: find linux/scripts linux/install linux/config/quickshell/scripts -type f -print0 | xargs -0 shellcheck -S error
      - name: Run lock-launcher regression test
        run: bash linux/scripts/tests/lock-launcher.test.sh
      - name: Check zsh syntax
        run: find linux/config/zsh -type f -print0 | xargs -0 zsh -n
      - name: Guard 1Password refs against plaintext secrets
        run: |
          bad="$(grep -nEH '^[A-Za-z_][A-Za-z0-9_]*=' linux/config/oprefs/*.env 2>/dev/null | grep -vE 'op://' || true)"
          if [[ -n "$bad" ]]; then
            echo "$bad"
            echo "linux/config/oprefs/*.env must contain only op:// secret references, never plaintext values" >&2
            exit 1
          fi

  qml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt QML linter
        run: sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools
      - name: Lint Quickshell QML
        run: |
          if [ -x /usr/lib/qt6/bin/qmllint ]; then
            qmllint_bin=/usr/lib/qt6/bin/qmllint
          else
            qmllint_bin="$(command -v qmllint)"
          fi
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          if ! "$qmllint_bin" linux/config/quickshell/*.qml >"$output" 2>&1; then
            cat "$output"
            exit 1
          fi
          cat "$output"
          # Standalone Qt lacks Quickshell's full native type metadata. Keep
          # those environment-dependent diagnostics visible, but fail on any
          # other warning.
          if grep -E '^Warning:' "$output" \
            | grep -vE '\[(import|missing-property|missing-type|uncreatable-type|unresolved-type|signal-handler-parameters)\]'; then
            exit 1
          fi

  installer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run installer manifest tests
        run: for test in linux/install/tests/*.test.sh; do bash "$test"; done

  yamlfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Install yamlfmt
        run: go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0
      - name: Lint YAML files
        run: yamlfmt -conf .yamlfmt.yaml -lint .

  whitespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whitespace and conflict markers
        run: |-
          base="${{ github.event.pull_request.base.sha }}"
          [ -n "$base" ] || base="${{ github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            # Initial push or event payload without a base; use the parent of HEAD.
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -n "$base" ]; then
            git diff --check "$base" HEAD
          else
            git show --check --format= HEAD
          fi
