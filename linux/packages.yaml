          - linux/xprofile:$HOME/.xprofile
          - linux/xinitrc:$HOME/.xinitrc
          - linux/config/default-apps.list:$HOME/.local/share/applications/defaults.list
          - linux/config/fonts.conf:$XDG_CONFIG_HOME/fontconfig/fonts.conf
          - linux/config/mimeapps.conf:$HOME/.local/share/applications/mimeapps.list
          - linux/config/mimeapps.conf:$XDG_CONFIG_HOME/mimeapps.list
          - linux/config/usb-notify/usb-notify.service:$XDG_CONFIG_HOME/systemd/user/usb-notify.service
          - linux/config/bluetooth-notify/bluetooth-notify.service:$XDG_CONFIG_HOME/systemd/user/bluetooth-notify.service
    services:
      - bluetooth
      - NetworkManager
      - avahi-daemon
      - cups
      - nordvpnd
  server:
    packages:
      core: {}
    services:
      - sshd
