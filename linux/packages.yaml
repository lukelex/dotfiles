common:
  packages:
    core:
      openssh: []
      docker:
        groups:
          - docker
        services:
          system:
            - docker
      docker-buildx: []
      docker-compose: []
      git: []
      man-db: []
      wget: []
      zsh: []
      zsh-completions: []
      neovim: []
