          services:
            system:
              - sshd
resources:
  configs:
    - source: linux/config/session/dotfiles-idle.service
      target: $XDG_CONFIG_HOME/systemd/user/dotfiles-idle.service
      profiles:
        - desktop
    - source: linux/config/session/dotfiles-lock.service
      target: $XDG_CONFIG_HOME/systemd/user/dotfiles-lock.service
      profiles:
        - desktop
    - source: linux/config/network-monitor/network-monitor.service
      target: $XDG_CONFIG_HOME/systemd/user/network-monitor.service
      profiles:
        - desktop
    - linux/config/opencode:$XDG_CONFIG_HOME/opencode
    - source: linux/config/github-review-notify/github-review-notify.service
      target: $XDG_CONFIG_HOME/systemd/user/github-review-notify.service
      profiles:
        - desktop
    - source: linux/config/github-review-notify/github-review-notify.timer
      target: $XDG_CONFIG_HOME/systemd/user/github-review-notify.timer
      profiles:
        - desktop
    - source: linux/profile
      target: $HOME/.profile
      profiles:
        - desktop
    - source: icons/Bibata-Modern-Amber
      target: $HOME/.local/share/icons/Bibata-Modern-Amber
      profiles:
        - desktop
    - source: linux/config/gitconfig
      target: $HOME/.gitconfig
      profiles:
        - desktop
        - server
    - source: linux/config/default-apps.list
      target: $HOME/.local/share/applications/defaults.list
      profiles:
        - desktop
    - source: linux/config/fonts.conf
      target: $XDG_CONFIG_HOME/fontconfig/fonts.conf
      profiles:
        - desktop
    - source: linux/config/mimeapps.conf
      target: $HOME/.local/share/applications/mimeapps.list
      profiles:
        - desktop
    - source: linux/config/mimeapps.conf
      target: $XDG_CONFIG_HOME/mimeapps.list
      profiles:
        - desktop
    - source: linux/config/yazi.desktop
      target: $HOME/.local/share/applications/yazi.desktop
      profiles:
        - desktop
    - source: linux/config/opencode-desktop/ai.opencode.desktop.desktop
      target: $HOME/.local/share/applications/ai.opencode.desktop.desktop
      profiles:
        - desktop
    - source: linux/config/opencode-desktop/ai.opencode.desktop.png
      target: $HOME/.local/share/icons/hicolor/128x128/apps/ai.opencode.desktop.png
      profiles:
        - desktop
  services:
    - name: network-monitor.service
      scope: user
      profiles:
        - desktop
    - name: github-review-notify.timer
      scope: user
      profiles:
        - desktop
    - name: sddm
      scope: system
      profiles:
        - desktop
      selections:
        - i3
