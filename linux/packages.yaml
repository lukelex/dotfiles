common:
  packages:
    core:
      openssh: []
      docker:
        groups:
          - docker
      docker-buildx: []
      docker-compose: []
      git: []
      man-db: []
      wget: []
      zsh: []
      zsh-completions: []
      neovim: []
      fd: []
      fzf: []
      ripgrep: []
      jq: []
      tree: []
      bat: []
      diff-so-fancy: []
      btop: []
      ttf-hack-nerd: []
    zsh:
      configs:
        - linux/config/zsh/zshrc:$HOME/.zshrc
    neovim:
      configs:
        - linux/config/nvim:$XDG_CONFIG_HOME/nvim
    opencode:
      install: false
      configs:
        - linux/config/opencode:$XDG_CONFIG_HOME/opencode
  services:
    - docker
