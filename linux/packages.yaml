source: aur
common:
  packages:
    headless:
      1password-cli:
      bat:
      btop:
      diff-so-fancy:
      docker:
        groups:
          - docker
        services:
          system:
            - docker
      docker-buildx:
      docker-compose:
      downgrade:
      fd:
      fzf:
      git:
      jq:
      man-db:
      neovim:
        configs:
          - linux/config/nvim:$XDG_CONFIG_HOME/nvim
      openssh:
      ripgrep:
      tree:
      ttf-hack-nerd:
      wget:
      zsh:
        configs:
          - linux/config/zsh/zshrc:$HOME/.zshrc
      zsh-completions:
profiles:
  desktop:
    packages:
      desktop:
        1password:
        avahi:
          services:
            system:
              - avahi-daemon
        bc:
        blueman:
          configs:
            - linux/config/bluetooth-notify/bluetooth-notify.service:$XDG_CONFIG_HOME/systemd/user/bluetooth-notify.service
          services:
            system:
              - bluetooth
            user:
              - bluetooth-notify.service
        cameractrls:
          groups:
            - video
        cifs-utils:
        cmake:
        cups:
          groups:
            - lp
          services:
            system:
              - cups
        dbus:
        ddcutil:
        etcher-bin:
        fastfetch:
        fprintd:
        fragments:
        gammastep:
          configs:
            - linux/config/gammastep/config.ini:$XDG_CONFIG_HOME/gammastep/config.ini
            - linux/config/gammastep/night-mode-sunset.service:$XDG_CONFIG_HOME/systemd/user/night-mode-sunset.service
            - linux/config/gammastep/night-mode-sunset.timer:$XDG_CONFIG_HOME/systemd/user/night-mode-sunset.timer
          services:
            user:
              - gammastep.service
              - night-mode-sunset.timer
        google-chrome:
        ibus:
        imagemagick:
        inetutils:
        kitty:
          configs:
            - linux/config/kitty:$XDG_CONFIG_HOME/kitty
        kmonad:
        kvantum:
        light:
        lm_sensors: {}
        mpv:
        network-manager-applet:
          services:
            system:
              - NetworkManager
        nordvpn-bin:
          groups:
            - nordvpn
          services:
            system:
              - nordvpnd
        noto-fonts-cjk:
        noto-fonts-emoji:
        npm:
        pantheon-calculator:
        papirus-icon-theme:
        pavucontrol:
        pcmanfm:
        pipewire-alsa:
        pipewire-jack:
        pipewire-pulse:
        playerctl:
        polkit:
        polkit-gnome:
        postbird-bin:
        qt5-wayland:
        qt5ct:
        qt6-svg:
        qt6-wayland:
        quickshell:
          configs:
            - linux/config/quickshell:$XDG_CONFIG_HOME/quickshell
            - linux/config/quickshell/quickshell.service:$XDG_CONFIG_HOME/systemd/user/quickshell.service
        rubygems:
        rust:
        seadrive-gui:
        spotify:
        system-config-printer:
          groups:
            - lp
        tidy:
        ttf-hack:
        udiskie:
          configs:
            - linux/config/usb-notify/usb-notify.service:$XDG_CONFIG_HOME/systemd/user/usb-notify.service
          services:
            user:
              - usb-notify.service
        unrar:
        unzip:
        v4l-utils:
          groups:
            - video
        viewnior:
        yazi:
        zathura:
        zathura-pdf-mupdf:
        zeal:
        zip:
      extras:
        blanket:
        ghostscript:
        kbt:
        smbclient:
        sxiv:
        sysstat:
        tldr:
      hyprland:
        awww:
        cliphist:
        hypridle:
        hyprland:
          configs:
            - linux/config/hypr:$XDG_CONFIG_HOME/hypr
        hyprlock:
        hyprpanel-bin:
        hyprshot:
        kooha:
        slurp:
        sox:
        swhkd-bin:
        tofi:
          configs:
            - linux/config/tofi.conf:$XDG_CONFIG_HOME/tofi/config
        wdisplays:
        wf-recorder:
        xdg-desktop-portal-hyprland:
      i3:
        arandr:
        autorandr:
          configs:
            - linux/config/autorandr/postswitch:$XDG_CONFIG_HOME/autorandr/postswitch
        flameshot:
          configs:
            - linux/config/flameshot.ini:$XDG_CONFIG_HOME/flameshot/flameshot.ini
        i3-wm:
          configs:
            - linux/config/i3/main.conf:$XDG_CONFIG_HOME/i3/config
            - linux/config/gsimplecal:$XDG_CONFIG_HOME/gsimplecal/config
            - linux/Xresources:$HOME/.Xresources
            - linux/xprofile:$HOME/.xprofile
            - linux/xinitrc:$HOME/.xinitrc
        i3lock:
        picom:
        rofi:
          configs:
            - linux/config/rofi:$XDG_CONFIG_HOME/rofi
        rofi-bluetooth-git:
        rofi-greenclip:
          configs:
            - linux/config/greenclip.toml:$XDG_CONFIG_HOME/greenclip.toml
        sddm:
        simplescreenrecorder:
        sxhkd:
        xautolock:
          configs:
            - linux/config/xautolock/xautolock.service:$XDG_CONFIG_HOME/systemd/user/xautolock.service
          services:
            user:
              - xautolock.service
        xclip:
        xdotool:
        xfce4-power-manager:
        xorg-server:
        xorg-xinit:
        xorg-xkill:
        xss-lock:
        xwallpaper:
    options:
      ipod:
        default: yes
        packages:
          gvfs:
          libgpod:
          rhythmbox:
        prompt: Would you like to be able to sync your iPod? [Y/n]
      nvidia:
        default: no
        packages:
          nvidia-open:
          nvidia-prime:
        prompt: Would you like to install the NVIDIA driver? [y/N]
      nvidia-gui:
        default: no
        packages:
          nvidia-settings:
        prompt: Would you like to install NVIDIA Settings? [y/N]
      optional:
        default: yes
        packages:
          birdfont:
          curtail:
          discord:
          kicad:
          slack-desktop:
          telegram-desktop:
          via-appimage:
          whatsapp-for-linux-git:
        prompt: Would you like to install optional dependencies? [Y/n]
  server:
    packages:
      headless:
        openssh:
          services:
            system:
              - sshd
resources:
  configs:
    - linux/config/opencode:$XDG_CONFIG_HOME/opencode
    - source: linux/profile
      target: $HOME/.profile
      profiles:
        - desktop
    - source: icons/Bibata-Modern-Amber
      target: $HOME/.local/share/icons/Bibata-Modern-Amber
      profiles:
        - desktop
    - source: linux/config/gitconfig
      target: $HOME/.gitconfig
      profiles:
        - desktop
        - server
    - source: linux/config/default-apps.list
      target: $HOME/.local/share/applications/defaults.list
      profiles:
        - desktop
    - source: linux/config/fonts.conf
      target: $XDG_CONFIG_HOME/fontconfig/fonts.conf
      profiles:
        - desktop
    - source: linux/config/mimeapps.conf
      target: $HOME/.local/share/applications/mimeapps.list
      profiles:
        - desktop
    - source: linux/config/mimeapps.conf
      target: $XDG_CONFIG_HOME/mimeapps.list
      profiles:
        - desktop
  services:
    - name: sddm
      scope: system
      profiles:
        - desktop
      selections:
        - i3
