shadow = true;
shadow-radius = 12;
shadow-opacity = .75;
shadow-offset = -15;

corner-radius = 6
corner-radius-rules = [
    "26:name = 'quickshell' && window_type = 'normal'"
];
backend = "glx";
blur-method = "dual_kawase";
blur-strength = 2;
blur-background = true;
blur-background-exclude = [
    "name != 'quickshell'",
    "window_type = 'dock'",
    "name = 'quickshell' && window_type = 'tooltip'"
];
shadow-exclude = [ "name = 'quickshell' && window_type = 'tooltip'" ];
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-client-opacity = true;
# unredir-if-possible = true;
vsync = true;
dbe = false;
focus-exclude = [ "class_g = 'Cairo-clock'" ];
detect-transient = true;
detect-client-leader = true;
invert-color-include = [ ];
glx-copy-from-front = false;
use-damage = true;

wintypes :
{
  dock : { shadow = false; };
  notification : { shadow = false; };
  fullscreen :
  {
    fade = true;
    shadow = false;
    opacity = 1;
    focus = true;
  };
};
