general {
}

background {
  monitor =

  path = /home/lukas/wallpaper.png
}

label {
  monitor =

  text = cmd[update:1000] echo "<span>$(date '+%A, %d %B')</span>"
  color = rgba(250, 250, 250, 0.8)
  font_size = 32
  font_family = Hack

  position = 0, -96
  halign = center
  valign = top
}

label {
  monitor =

  text = $TIME
  color = rgba(250, 250, 250, 0.8)
  font_size = 128
  font_family = Hack Bold

  position = 0, -170
  halign = center
  valign = top
}

# Session-lock surfaces hide regular layer-shell notification popups. Render
# the notification history inside hyprlock instead.
image {
  monitor =
  path = ~/.cache/dotfiles/lock-notifications.png
  size = 600
  border_size = 0
  rounding = 0
  reload_time = 1
  reload_cmd = if command -v u_lock-notifications > /dev/null 2>&1; then u_lock-notifications; else "$HOME/dotfiles/linux/scripts/lock-notifications"; fi

  position = -24, 0
  halign = right
  valign = center
}

label {
  monitor =

  text =  $USER
  color = rgba(200, 200, 200, 1.0)
  font_size = 32
  font_family = Hack Medium

  position = 0, 192
  halign = center
  valign = bottom
}

label {
  monitor =

  text = cmd[update:60000] sh -c 'device=$(upower -e 2>/dev/null | grep BAT | head -n 1); [ -n "$device" ] && upower -i "$device" 2>/dev/null | awk "/percentage:/{print \" \" \$2; exit}"'
  color = rgba(200, 200, 200, 1.0)
  font_size = 24
  font_family = Hack

  position = 0, 244
  halign = center
  valign = bottom
}

input-field {
  monitor =

  size = 320, 64
  outline_thickness = 6
  dots_size = 0.33
  dots_spacing = 0.15
  dots_center = true
  outer_color = rgb(CC7833)
  inner_color = rgb(92764C)
  font_color = rgb(000000)
  fade_on_empty = false
  placeholder_text = Enter Password
  hide_input = false

  position = 0, 96
  halign = center
  valign = bottom
}
