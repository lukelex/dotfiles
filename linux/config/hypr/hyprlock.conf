# Media is read-only on the lock screen. Its local cover art is refreshed from
# the active MPRIS player; remote artwork is never fetched while locked.
image {
  monitor = @PRIMARY_MONITOR@
  path = ~/.cache/dotfiles/lock-media-art.png
  size = 144
  border_size = 0
  rounding = 18
  reload_time = 5
  reload_cmd = "$HOME/dotfiles/linux/scripts/lock-media-art"
  position = 36, 36
  halign = left
  valign = bottom
}

label {
  monitor = @PRIMARY_MONITOR@
  text = cmd[update:5000] "$HOME/dotfiles/linux/scripts/lock-status" media
  color = rgba(183, 190, 201, 1.0)
  font_size = 15
  font_family = Hack Nerd Font Mono
  position = 36, 20
  halign = left
  valign = bottom
}

# Session-lock surfaces hide regular layer-shell notification popups. Render
# the persisted Quickshell history into a themed, regularly refreshed asset.
image {
  monitor = @PRIMARY_MONITOR@
  path = ~/.cache/dotfiles/lock-notifications.png
  size = 600
  border_size = 0
  rounding = 0
  reload_time = 1
  reload_cmd = "$HOME/dotfiles/linux/scripts/lock-notifications"
  position = -32, 0
  halign = right
  valign = center
}

label {
  monitor = @PRIMARY_MONITOR@
  text = 󰍡 $USER
  color = rgba(248, 249, 251, 1.0)
  font_size = 20
  font_family = Hack Nerd Font Mono
  position = 0, 232
  halign = center
  valign = bottom
}

input-field {
  monitor = @PRIMARY_MONITOR@
  size = 360, 58
  outline_thickness = 2
  dots_size = 0.28
  dots_spacing = 0.16
  dots_center = true
  outer_color = rgb(62, 89, 120)
  inner_color = rgba(43, 48, 58, 0.94)
  font_color = rgba(248, 249, 251, 1.0)
  check_color = rgb(140, 174, 216)
  fail_color = rgb(218, 73, 57)
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  fail_transition = 300
  fade_on_empty = false
  placeholder_text = <i>Password</i>
  hide_input = true
  position = 0, 160
  halign = center
  valign = bottom
}

label {
  monitor = @PRIMARY_MONITOR@
  text = cmd[update:1000] hyprctl devices -j 2>/dev/null | jq -r '.keyboards[] | select(.main) | .active_keymap' | head -n 1
  color = rgba(183, 190, 201, 1.0)
  font_size = 13
  font_family = Hack Nerd Font Mono
  position = 0, 124
  halign = center
  valign = bottom
}

label {
  monitor = @PRIMARY_MONITOR@
  text = cmd[update:1000] hyprctl devices -j 2>/dev/null | jq -r '[.keyboards[] | select(.main) | if .capsLock then "Caps Lock" else empty end, if .numLock then "Num Lock" else empty end] | join(" · ")'
  color = rgb(218, 73, 57)
  font_size = 13
  font_family = Hack Nerd Font Mono
  position = 0, 102
  halign = center
  valign = bottom
}
