general {
  hide_cursor = true
}

# Replaced by u_hyprlock only when fprintd reports an enrolled reader.
# @FINGERPRINT_AUTH@

animations {
  enabled = true
  bezier = lockEase, 0.16, 1, 0.3, 1
  animation = fadeIn, 1, 5, lockEase
  animation = fadeOut, 1, 2, lockEase
  animation = inputFieldDots, 1, 2, lockEase
}

background {
  monitor =
  path = ~/wallpaper.png
  color = rgba(43, 48, 58, 0.78) # time-of-day tint is applied by u_hyprlock
  blur_passes = 3
  blur_size = 7
  # Fine grain keeps the blurred wallpaper alive without competing with the UI.
  noise = 0.024
  contrast = 0.92
  brightness = 0.72
  vibrancy = 0.12
  vibrancy_darkness = 0.18
}

# Time remains the visual anchor. The supporting date and status labels use the
# same primary/secondary slate palette as Quickshell's bar and control panels.
label {
  monitor =
  text = cmd[update:1000] date '+%A, %-d %B'
  color = rgba(183, 190, 201, 1.0)
  font_size = 21
  font_family = Hack Nerd Font Mono
  position = 0, -72
  halign = center
  valign = top
}

label {
  monitor =
  text = $TIME
  color = rgba(248, 249, 251, 1.0)
  font_size = 92
  font_family = Hack Nerd Font Mono
  position = 0, -100
  halign = center
  valign = top
}

# A concise system overview. lock-status only reads system state: it never
# sends notifications or changes a device while the session is locked.
label {
  monitor = @PRIMARY_MONITOR@
  text = cmd[update:10000] "$HOME/dotfiles/linux/scripts/lock-status" battery
  color = rgba(248, 249, 251, 1.0)
  font_size = 18
  font_family = Hack Nerd Font Mono
  position = 36, -176
  halign = left
  valign = top
}

